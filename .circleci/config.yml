          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target fft_bluestein -j2
      - run:
          name: FFT via Bluestein
          command: LIONSS_LP=1 ./build/fft_bluestein --in seq.txt --prime

